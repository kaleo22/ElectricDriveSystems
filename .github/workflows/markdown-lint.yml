name: "CI — Markdown Lint"

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"

jobs:
  markdown-lint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.yaml
          globs: "**/*.md"
